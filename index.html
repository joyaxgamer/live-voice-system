<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24/7 Live Voice Chat</title>
  <script src="https://unpkg.com"></script>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .btn { padding: 22px 42px; font-size: 20px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    #joinBtn { background: #00e676; color: #000; }
    #endBtn { background: #ff1744; color: #fff; display: none; margin-top: 20px; }
    #status { margin-top: 25px; color: #00e676; font-size: 18px; padding: 0 20px; font-weight: bold; }
  </style>
</head>
<body>
  <button id="joinBtn" class="btn" onclick="startVoice()">TAP TO JOIN VOICE</button>
  <button id="endBtn" class="btn" onclick="stopVoice()">DISCONNECT CALL</button>
  <div id="status">Ready - Tap Button</div>
  <audio id="remoteAudio" autoplay></audio>

  <script>
    const ROOM_ID = "joyax-live-voice-2026";
    let localStream, peer, currentCall, ws, isUserEnded = false;

    async function startVoice() {
      const status = document.getElementById('status');
      status.innerText = "Button Clicked! Checking Mic...";
      
      try {
        isUserEnded = false;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          status.innerText = "Error: Browser does not support Mic";
          return;
        }

        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        document.getElementById('joinBtn').style.display = 'none';
        document.getElementById('endBtn').style.display = 'block';
        status.innerText = "Mic Connected! Fetching Server...";

        const res = await fetch('url.txt?t=' + Date.now());
        const rawUrl = (await res.text()).trim();
        
        if (!rawUrl.startsWith('https://')) {
          status.innerText = "Error: url.txt has invalid link (" + rawUrl + ")";
          return;
        }

        const wsUrl = rawUrl.replace('https://', 'wss://');
        connectBridge(wsUrl);
        connectPeer();

      } catch (err) {
        status.style.color = "#ff5252";
        status.innerText = "Failed: " + err.name + " - " + err.message;
      }
    }

    function connectBridge(wsUrl) {
      const status = document.getElementById('status');
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        status.innerText = "Connected to YouTube Live! Waiting for Partner...";
        const recorder = new MediaRecorder(localStream);
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws.readyState === WebSocket.OPEN && !isUserEnded) {
            ws.send(e.data);
          }
        };
        recorder.start(300);
      };
      ws.onerror = () => {
        status.innerText = "Bridge Error: Server not reachable";
      };
    }

    function connectPeer() {
      const status = document.getElementById('status');
      peer = new Peer(ROOM_ID);
      peer.on('open', () => {
        status.innerText = "Room Active! Voice Going Live...";
      });
      peer.on('call', (call) => {
        currentCall = call;
        call.answer(localStream);
        call.on('stream', (stream) => {
          document.getElementById('remoteAudio').srcObject = stream;
          status.innerText = "Talking Live with Partner!";
        });
      });
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          const guest = new Peer();
          guest.on('open', () => {
            currentCall = guest.call(ROOM_ID, localStream);
            currentCall.on('stream', (stream) => {
              document.getElementById('remoteAudio').srcObject = stream;
              status.innerText = "Talking Live with Partner!";
            });
          });
        }
      });
    }

    function stopVoice() {
      isUserEnded = true;
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
      if (ws) ws.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      document.getElementById('status').innerText = "Disconnected";
      document.getElementById('endBtn').style.display = 'none';
      document.getElementById('joinBtn').style.display = 'block';
    }
  </script>
</body>
</html>
