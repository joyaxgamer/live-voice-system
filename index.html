<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24/7 Live Voice Chat</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com"></script>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .btn { padding: 22px 42px; font-size: 20px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    #joinBtn { background: #00e676; color: #000; }
    #endBtn { background: #ff1744; color: #fff; display: none; margin-top: 20px; }
    #status { margin-top: 25px; color: #00e676; font-size: 16px; padding: 0 20px; font-weight: bold; }
  </style>
</head>
<body>
  <button id="joinBtn" class="btn" onclick="startVoice()">TAP TO JOIN VOICE</button>
  <button id="endBtn" class="btn" onclick="stopVoice()">DISCONNECT CALL</button>
  <div id="status">Ready - Tap Button</div>
  <audio id="remoteAudio" autoplay playsinline></audio>
  <audio id="bgKeepAlive" loop playsinline></audio>

  <script>
    const ROOM_ID = "joyax-live-voice-2026";
    let localStream, peer, currentCall, ws, recorder, watchdogTimer, isUserEnded = false, activeWsUrl = "";

    // 10 सेकंड का असली WAV ऑडियो बनाना ताकि Android लॉक-स्क्रीन मीडिया प्लेयर सक्रिय रखे
    function createSilentWavUrl() {
      const sampleRate = 8000, seconds = 10, numSamples = sampleRate * seconds;
      const buffer = new ArrayBuffer(44 + numSamples);
      const view = new DataView(buffer);
      const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
      writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples, true); writeStr(8, 'WAVE');
      writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate, true);
      view.setUint16(32, 1, true); view.setUint16(34, 8, true); writeStr(36, 'data');
      view.setUint32(40, numSamples, true);
      for (let i = 44; i < 44 + numSamples; i++) view.setUint8(i, 128);
      return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
    }

    async function startVoice() {
      const status = document.getElementById('status');
      status.style.color = "#00e676";
      status.innerText = "Starting Mic...";
      
      try {
        isUserEnded = false;

        // असली 10-सेकंड मीडिया नोटिफिकेशन चालू करना
        const bgAudio = document.getElementById('bgKeepAlive');
        if (!bgAudio.src) bgAudio.src = createSilentWavUrl();
        bgAudio.volume = 0.05;
        await bgAudio.play();

        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Live Voice Connected',
            artist: 'Do not close - Active Call'
          });
          navigator.mediaSession.playbackState = 'playing';
        }

        if ('wakeLock' in navigator) {
          try { await navigator.wakeLock.request('screen'); } catch(e) {}
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        document.getElementById('joinBtn').style.display = 'none';
        document.getElementById('endBtn').style.display = 'block';

        // 1. सबसे पहले सीधा Peer-to-Peer वॉइस कॉल जोड़ना (बिना एक पल की देरी के)
        status.innerText = "Connecting Direct Voice...";
        connectPeer();

        // 2. इसके बाद YouTube लाइव ब्रिज से जुड़ना
        const res = await fetch('url.txt?nocache=' + Date.now());
        const rawUrl = (await res.text()).trim();
        if (rawUrl.startsWith('https://')) {
          activeWsUrl = rawUrl.replace('https://', 'wss://');
          connectBridge(activeWsUrl);
        }

        // हर 4 सेकंड में बैकग्राउंड कनेक्शन चेक करने वाला वॉचडॉग
        clearInterval(watchdogTimer);
        watchdogTimer = setInterval(() => {
          if (isUserEnded) return;
          if (bgAudio.paused) bgAudio.play().catch(() => {});
          if (peer && peer.disconnected && !peer.destroyed) peer.reconnect();
          if (activeWsUrl && (!ws || ws.readyState === WebSocket.CLOSED)) {
            connectBridge(activeWsUrl);
          } else if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send('ping');
          }
        }, 4000);

      } catch (err) {
        status.style.color = "#ff5252";
        status.innerText = "Error: " + err.message;
      }
    }

    function connectPeer() {
      const status = document.getElementById('status');
      if (peer && !peer.destroyed) peer.destroy();
      peer = new Peer(ROOM_ID);

      peer.on('open', () => {
        status.innerText = "Voice Live! Waiting for Partner...";
      });

      peer.on('call', (call) => {
        currentCall = call;
        call.answer(localStream);
        call.on('stream', (stream) => {
          document.getElementById('remoteAudio').srcObject = stream;
          status.innerText = "Connected! Talking Live";
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          const guest = new Peer();
          guest.on('open', () => {
            currentCall = guest.call(ROOM_ID, localStream);
            currentCall.on('stream', (stream) => {
              document.getElementById('remoteAudio').srcObject = stream;
              status.innerText = "Connected! Talking Live";
            });
          });
        }
      });
    }

    function connectBridge(wsUrl) {
      if (isUserEnded) return;
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        if (recorder && recorder.state !== 'inactive') {
          try { recorder.stop(); } catch(e) {}
        }
        recorder = new MediaRecorder(localStream);
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws.readyState === WebSocket.OPEN && !isUserEnded) {
            ws.send(e.data);
          }
        };
        recorder.start(300);
      };
    }

    function stopVoice() {
      isUserEnded = true;
      clearInterval(watchdogTimer);
      document.getElementById('bgKeepAlive').pause();
      if (recorder && recorder.state !== 'inactive') try { recorder.stop(); } catch(e) {}
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
      if (ws) ws.close();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      document.getElementById('status').innerText = "Disconnected";
      document.getElementById('endBtn').style.display = 'none';
      document.getElementById('joinBtn').style.display = 'block';
    }
  </script>
</body>
</html>
