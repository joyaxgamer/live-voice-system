name: 24/7 Auto Live & Voice Server
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg nodejs npm
          npm install ws express
          wget -q https://github.com -O cloudflared
          chmod +x cloudflared

      - name: Start Bridge & Auto-Update URL
        run: |
          node bridge.js &
          ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "$TUNNEL_URL" > url.txt
          git config user.name "AutoBot"
          git config user.email "bot@github.com"
          git add url.txt
          git commit -m "Update live tunnel URL" || true
          git push

      - name: Run 24/7 YouTube Stream (5.5 Hours)
        run: |
          timeout 19800 ffmpeg -re -stream_loop -1 -i lovee_video.mp4 \
            -re -stream_loop -1 -i lovee_audio.mp3 \
            -thread_queue_size 1024 -i "http://localhost:8080/voice.mp3" \
            -filter_complex "[1:a][2:a]sidechaincompress=threshold=0.005:ratio=20:attack=50:release=1000[bg];[2:a]volume=1.8[voice];[bg][voice]amix=inputs=2:duration=first:normalize=0[out]" \
            -map 0:v -map "[out]" \
            -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://://youtube.com{{ secrets.YT_STREAM_KEY }}" || true

      - name: Auto-Restart Next 24/7 Session
        if: always()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://github.com{{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d '{"ref":"main"}'
